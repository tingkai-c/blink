name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA export method"
        type: choice
        required: true
        default: ad-hoc
        options:
          - ad-hoc
          - development

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Cache Swift packages
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift', 'xcfs/Package.resolved') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_frameworks.sh

      - name: Get resources
        run: ./get_resources.sh

      - name: Prepare default developer config
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Build tests for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme BlinkTests \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build-for-testing

  signed-ipa:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list runtimes | sed -n '1,80p'

      - name: Cache Swift packages
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift', 'xcfs/Package.resolved') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_frameworks.sh

      - name: Get resources
        run: ./get_resources.sh

      - name: Prepare signing inputs and patch project
        env:
          EXPORT_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.export_method || 'ad-hoc' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_GROUP_ID: ${{ secrets.IOS_GROUP_ID }}
          IOS_CLOUD_ID: ${{ secrets.IOS_CLOUD_ID }}
          IOS_KEYCHAIN_ID1: ${{ secrets.IOS_KEYCHAIN_ID1 }}
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_FILE_PROVIDER_BASE64: ${{ secrets.PROFILE_FILE_PROVIDER_BASE64 }}
          PROFILE_FILE_PROVIDER_UI_BASE64: ${{ secrets.PROFILE_FILE_PROVIDER_UI_BASE64 }}
          TARGET_DEVICE_UDID: ${{ secrets.TARGET_DEVICE_UDID }}
        run: python3 .github/scripts/prepare_blink_signing.py

      - name: Show resolved signing build settings
        run: |
          xcodebuild -showBuildSettings \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_ENTITLEMENTS|INFOPLIST_FILE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY' \
            | sed -E 's/(PROVISIONING_PROFILE_SPECIFIER = ).*/\1<redacted>/'

      - name: Archive Blink
        timeout-minutes: 35
        run: |
          set -o pipefail
          mkdir -p build/logs
          NSUnbufferedIO=YES xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Blink.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -showBuildTimingSummary \
            clean archive 2>&1 | tee build/logs/archive.log

      - name: Export signed IPA
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild -exportArchive \
            -archivePath build/Blink.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ci/ExportOptions.plist \
            2>&1 | tee build/logs/export.log

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-build-logs-${{ github.run_number }}
          path: build/logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify signed IPA
        run: .github/scripts/verify_ipa.sh build/export/Blink.ipa

      - name: Upload signed IPA and verification report
        uses: actions/upload-artifact@v4
        with:
          name: Blink-signed-ipa-${{ github.run_number }}
          path: |
            build/export/Blink.ipa
            build/Blink.xcarchive/dSYMs/**
            build/verification/**
            build/ci/ExportOptions.redacted.plist
          if-no-files-found: error
          retention-days: 14
